components:
  schemas:
    brigade-service_service_brigade.Brigade:
      properties:
        CreatedAt:
          type: string
        ID:
          type: integer
        Inspectors:
          items:
            $ref: '#/components/schemas/brigade.Inspector'
          type: array
          uniqueItems: false
        Status:
          $ref: '#/components/schemas/brigade.Status'
        UpdatedAt:
          type: string
      type: object
    brigade.CreateBrigadeRequest:
      properties:
        InspectorIDs:
          items:
            type: integer
          type: array
          uniqueItems: false
      type: object
    brigade.Inspector:
      properties:
        AssignedAt:
          type: string
        CreatedAt:
          type: string
        Email:
          type: string
        ID:
          type: integer
        Name:
          type: string
        Patronymic:
          type: string
        PhoneNumber:
          type: string
        Surname:
          type: string
        UpdatedAt:
          type: string
      type: object
    brigade.Status:
      enum:
      - 0
      - 1
      - 2
      - 3
      type: integer
      x-enum-varnames:
      - StatusUnknown
      - StatusIdle
      - StatusOnTask
      - StatusArchived
    gorouter.ErrorInfo:
      properties:
        code:
          type: string
        message:
          type: string
      type: object
    gorouter.ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/gorouter.ErrorInfo'
      type: object
externalDocs:
  description: ""
  url: ""
info:
  description: API for managing inspector brigades.
  title: Brigade Service API
  version: "1.0"
openapi: 3.1.0
paths:
  /brigades:
    get:
      description: Returns all brigades.
      parameters:
      - description: Maximum number of items to return; 0 means no limit
        in: query
        name: limit
        schema:
          type: integer
      - description: Number of items to skip
        in: query
        name: offset
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/brigade-service_service_brigade.Brigade'
                type: array
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gorouter.ErrorResponse'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gorouter.ErrorResponse'
          description: Internal Server Error
      summary: List brigades
      tags:
      - brigades
    post:
      description: Creates a brigade from inspector identifiers.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/brigade.CreateBrigadeRequest'
              description: Brigade creation payload
              summary: request
        description: Brigade creation payload
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/brigade-service_service_brigade.Brigade'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gorouter.ErrorResponse'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gorouter.ErrorResponse'
          description: Internal Server Error
      summary: Create brigade
      tags:
      - brigades
  /brigades/{id}:
    get:
      description: Returns a brigade with assigned inspectors.
      parameters:
      - description: Brigade ID
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/brigade-service_service_brigade.Brigade'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gorouter.ErrorResponse'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gorouter.ErrorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gorouter.ErrorResponse'
          description: Internal Server Error
      summary: Get brigade by ID
      tags:
      - brigades
servers:
- url: /api/brigade-service
